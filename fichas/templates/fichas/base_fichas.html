{% extends "main/base.html" %}
{% load static %}

{% block extra_head %}
<style>
.fichas-wrap { max-width: 1100px; margin: 0 auto; padding: 18px 12px; }
.fichas-actions { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.fichas-table { width:100%; border-collapse: collapse; background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; }
.fichas-table th, .fichas-table td { padding:10px 12px; border-bottom:1px solid #f3f4f6; text-align:left; font-size:14px; }
.fichas-table th { background:#f9fafb; font-weight:800; color:#111827; }
.fichas-table tr:last-child td { border-bottom:0; }
.btn { display:inline-flex; align-items:center; gap:6px; border-radius:10px; padding:8px 12px; border:1px solid #e5e7eb; background:#fff; cursor:pointer; font-weight:700; text-decoration:none; color:#111; }
.btn-primary { background:#5213a1; color:#fff; border-color:#5213a1; }
.btn-ghost { background:#f3f4f6; }
.card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px; box-shadow:0 10px 22px rgba(17,24,39,.06); }
.form-grid { display:grid; gap:12px; grid-template-columns:1fr 1fr; }
.form-grid .full { grid-column:1 / -1; }
.form-grid label { font-weight:700; font-size:14px; margin-bottom:4px; display:block; }
.form-grid input, .form-grid select, .form-grid textarea { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #e5e7eb; }
.alert { padding:10px 12px; border-radius:10px; background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; margin-bottom:12px; font-weight:700; }
</style>
{% endblock %}
