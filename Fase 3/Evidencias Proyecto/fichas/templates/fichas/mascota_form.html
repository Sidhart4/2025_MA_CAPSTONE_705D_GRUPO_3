{% extends "fichas/base_fichas.html" %}

{% block contenido %}
<main class="fichas-wrap">
  <div class="card">
    <h1 style="margin-top:0;">Crear mascota para cliente</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="form-grid">
        {% for field in form %}
          <div class="{% if forloop.counter > 4 %}full{% endif %}">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
            {% if field.errors %}<small class="error">{{ field.errors|join:', ' }}</small>{% endif %}
          </div>
        {% endfor %}
      </div>
      <div style="margin-top:12px; display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary">Guardar mascota</button>
        <a class="btn" href="{% url 'fichas:lista' %}">Volver</a>
      </div>
    </form>
  </div>
</main>
{% endblock %}
