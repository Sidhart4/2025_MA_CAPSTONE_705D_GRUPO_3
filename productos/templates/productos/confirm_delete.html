{% extends "main/base.html" %}
{% load static %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'productos/css/styles.css' %}?v=9">
{% endblock %}

{% block contenido %}
<main class="page">
  <section class="card confirm-delete">
    <h3>Eliminar producto</h3>
    <p>¿Estás seguro de que quieres eliminar <strong>"{{ object.nombre }}"</strong> permanentemente? Esta acción no se puede deshacer.</p>
    
    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <a class="btn btn-ghost" href="{% url 'productos:lista' %}">Cancelar</a>
        <button class="btn btn-danger">Sí, eliminar</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
