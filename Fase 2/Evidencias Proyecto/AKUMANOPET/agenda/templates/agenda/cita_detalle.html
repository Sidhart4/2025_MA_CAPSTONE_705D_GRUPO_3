{% extends "main/base.html" %}
{% block contenido %}
<main class="page">
  <div class="page-head"><h1>Detalle de cita</h1></div>
  <section class="card">
    <p><strong>Mascota:</strong> {{ cita.mascota }}</p>
    <p><strong>Fecha:</strong> {{ cita.fecha }}</p>
    <p><strong>Hora:</strong> {{ cita.hora }}</p>
    <p><strong>Duración:</strong> {{ cita.duracion_min }} min</p>
    <p><strong>Servicio:</strong> {{ cita.servicio }}</p>
    <p><strong>Profesional:</strong> {{ cita.profesional }}</p>
    <div class="actions" style="margin-top:1rem">
      <a class="btn-primary" href="{% url 'agenda:editar' cita.id %}">Editar</a>
      <a class="btn-light" href="{% url 'agenda:lista' %}?mode=day&day={{ cita.fecha|date:'Y-m-d' }}">Volver</a>
    </div>
  </section>
</main>
{% endblock %}
