<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Redirigiendo a Webpay...</title>
    <style>
      body { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background:#f8f6ff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
      .box { background:#fff; padding:2rem 2.5rem; border-radius:18px; box-shadow:0 16px 30px rgba(82,19,161,.12); text-align:center; max-width:360px; }
      h1 { font-size:1.4rem; margin-bottom:.5rem; }
      p { color:#594d74; margin-bottom:1.5rem; }
      button { background:#7C3AED; border:none; color:#fff; padding:.9rem 1.5rem; border-radius:999px; cursor:pointer; font-size:1rem; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Conectando con Transbank</h1>
      <p>Estamos enviando tu orden al portal de pagos Webpay. Si no eres redirigido automáticamente, presiona el botón.</p>
      <form id="tbkForm" action="{{ url_tbk }}" method="post">
        <input type="hidden" name="token_ws" value="{{ token }}">
        <button type="submit">Ir a Webpay</button>
      </form>
    </div>
    <script>
      const form = document.getElementById('tbkForm');
      if (form) {
        setTimeout(() => form.submit(), 600);
      }
    </script>
  </body>
</html>
